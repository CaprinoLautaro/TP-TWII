
<div class="forgot-wrapper">
  <div class="forgot-card">

    <div class="forgot-header">
      <div class="forgot-logo">🐾 Patitas</div>

      <h2>Recuperar contraseña</h2>

      <p>
        Ingresá tu correo electrónico para recibir
        un enlace de recuperación.
      </p>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Correo electrónico</label>

        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Ingresá tu correo electrónico"
        />

        @if (forgotForm.controls.email.invalid &&
        forgotForm.controls.email.touched) {
          <small class="error">
            Ingresá un correo electrónico válido.
          </small>
        }
      </div>


      <button
        type="submit"
        [disabled]="forgotForm.invalid || bloqueado() || enviando()"
      >
        @if (enviando()) {
          Enviando...
        } @else if (bloqueado()) {
          Solicitudes bloqueadas temporalmente
        } @else {
          Enviar enlace de recuperación
        }
      </button>

      @if (mensaje()) {
        <p
          class="mensaje-resultado"
          [class.mensaje-error]="esError()"
        >
          {{ mensaje() }}
        </p>
      }

    </form>

    <div class="forgot-footer">
      <a routerLink="/signin">Volver a iniciar sesión</a>
    </div>

  </div>
</div>
